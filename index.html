<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Girasol 3D Optimizado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- Librería principal de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cargador específico para formato GLB -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // 1. Configuración de la escena
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Luces para resaltar los colores
        const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(luzAmbiente);
        const luzDireccional = new THREE.DirectionalLight(0xffffff, 0.5);
        luzDireccional.position.set(10, 10, 10);
        scene.add(luzDireccional);

        // Alejar la cámara
        camera.position.z = 40; 

        // 3. Cargar el modelo GLB
        let miGirasol;
        const loader = new THREE.GLTFLoader();
        
        loader.load('girasol.glb', function (gltf) {
            miGirasol = gltf.scene;
            
            // Centrar en la pantalla
            miGirasol.position.set(0, 0, 0);
            scene.add(miGirasol);
            
        }, undefined, function (error) {
            console.error('Hubo un error cargando el modelo GLB:', error);
        });

        // 4. Bucle de animación
        function animate() {
            requestAnimationFrame(animate);
            if (miGirasol) {
                miGirasol.rotation.y += 0.01; // Rotación suave
            }
            renderer.render(scene, camera);
        }
        animate();

        // Ajustar la vista si se cambia el tamaño de la ventana
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
