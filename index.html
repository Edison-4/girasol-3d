<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Girasol 3D Optimizado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; } /* Fondo negro restaurado */
        canvas { display: block; }
        #estado {
            position: absolute; top: 20px; left: 20px;
            color: white; font-family: sans-serif; font-size: 16px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="estado">Cargando modelo girasol.glb...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100; // Cámara alejada para ver la flor completa

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luces fuertes para resaltar el modelo
        const luzAmbiente = new THREE.AmbientLight(0xffffff, 2);
        scene.add(luzAmbiente);
        const luzHemisferio = new THREE.HemisphereLight(0xffffbb, 0x080820, 2);
        scene.add(luzHemisferio);

        let miGirasol;
        const loader = new THREE.GLTFLoader();
        
        // El nombre exacto de tu archivo: girasol.glb
        loader.load('girasol.glb', function (gltf) {
            
            document.getElementById('estado').innerText = '¡Modelo cargado con éxito! ✅';
            
            miGirasol = gltf.scene;
            miGirasol.scale.set(0.5, 0.5, 0.5); 
            miGirasol.position.set(0, -15, 0);
            
            // Forzamos la lectura de color por si acaso
            miGirasol.traverse(function (hijo) {
                if (hijo.isMesh) {
                    hijo.material.vertexColors = true;
                    hijo.material.needsUpdate = true;
                }
            });

            scene.add(miGirasol);
            
        }, undefined, function (error) {
            document.getElementById('estado').innerText = '❌ Error: No se encontró girasol.glb';
            console.error(error);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (miGirasol) miGirasol.rotation.y += 0.01; 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
