<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detector Girasol 3D</title>
    <style>
        /* Fondo gris oscuro para confirmar que el código nuevo cargó */
        body { margin: 0; overflow: hidden; background-color: #222222; }
        canvas { display: block; }
        /* Texto de estado en la pantalla */
        #estado {
            position: absolute; top: 20px; left: 20px;
            color: white; font-family: sans-serif; font-size: 18px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="estado">Cargando modelo girasole.glb...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Luces extra fuertes por si el material se oscureció en la conversión
        const luzAmbiente = new THREE.AmbientLight(0xffffff, 2);
        scene.add(luzAmbiente);
        const luzHemisferio = new THREE.HemisphereLight(0xffffbb, 0x080820, 2);
        scene.add(luzHemisferio);

        let miGirasol;
        const loader = new THREE.GLTFLoader();
        
        loader.load('girasole.glb', function (gltf) {
            // Si funciona, cambia el texto
            document.getElementById('estado').innerText = '¡Modelo cargado con éxito! ✅';
            
            miGirasol = gltf.scene;
            miGirasol.scale.set(0.5, 0.5, 0.5); 
            miGirasol.position.set(0, -15, 0);
            scene.add(miGirasol);
            
        }, undefined, function (error) {
            // Si falla, te avisa en la pantalla
            document.getElementById('estado').innerText = '❌ Error: No se encontró o no se pudo leer girasole.glb';
        });

        function animate() {
            requestAnimationFrame(animate);
            if (miGirasol) miGirasol.rotation.y += 0.01; 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
