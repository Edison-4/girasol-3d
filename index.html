<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Girasol 3D Optimizado</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
        #estado {
            position: absolute; top: 20px; left: 20px;
            color: white; font-family: sans-serif; font-size: 16px;
            background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="estado">Cargando modelo girasol.glb...</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 50; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const luzAmbiente = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(luzAmbiente);
        const luzDireccional = new THREE.DirectionalLight(0xffffff, 1);
        luzDireccional.position.set(10, 10, 10);
        scene.add(luzDireccional);

        let miGirasol;
        const loader = new THREE.GLTFLoader();
        
        loader.load('girasol.glb', function (gltf) {
            document.getElementById('estado').innerText = '¡Modelo cargado con éxito! ✅';
            miGirasol = gltf.scene;
            
            // 1. PINTAR EL MODELO POR CÓDIGO PARA EVITAR QUE SE VEA NEGRO
            miGirasol.traverse(function (hijo) {
                if (hijo.isMesh) {
                    hijo.material = new THREE.MeshStandardMaterial({
                        color: 0xffcc00, // Color amarillo girasol
                        roughness: 0.4
                    });
                }
            });

            // 2. AUTO-CENTRAR EL MODELO MATEMÁTICAMENTE
            const cajaExterna = new THREE.Box3().setFromObject(miGirasol);
            const centro = cajaExterna.getCenter(new THREE.Vector3());
            miGirasol.position.x = -centro.x;
            miGirasol.position.y = -centro.y;
            miGirasol.position.z = -centro.z;

            scene.add(miGirasol);
            
        }, undefined, function (error) {
            document.getElementById('estado').innerText = '❌ Error al cargar';
            console.error(error);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (miGirasol) miGirasol.rotation.y += 0.01; 
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
