<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Girasol 3D Optimizado</title>
    <style>
        /* Mantenemos el fondo negro para que la flor resalte */
        body { margin: 0; overflow: hidden; background-color: #000000; }
        canvas { display: block; }
    </style>
</head>
<body>
    <!-- 1. Importamos las librerías de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <script>
        // 2. Configuración básica de la escena
        const scene = new THREE.Scene();
        
        // La cámara: alejamos la vista (z = 100) para poder ver modelos grandes
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 100; 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3. Luces para darle volumen
        const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(luzAmbiente);
        
        const luzDireccional = new THREE.DirectionalLight(0xffffff, 0.5);
        luzDireccional.position.set(10, 10, 10);
        scene.add(luzDireccional);

        // 4. Cargamos el modelo GLB
        let miGirasol;
        const loader = new THREE.GLTFLoader();
        
        loader.load('girasol.glb', function (gltf) {
            miGirasol = gltf.scene;
            
            // REDUCIMOS su tamaño a la mitad (0.5)
            miGirasol.scale.set(0.5, 0.5, 0.5); 
            
            // INTENTAMOS forzar la lectura del color de los vértices
            miGirasol.traverse(function (hijo) {
                if (hijo.isMesh) {
                    hijo.material.vertexColors = true; 
                    hijo.material.needsUpdate = true;
                }
            });

            // Bajamos un poco el modelo en la pantalla para que quede centrado
            miGirasol.position.set(0, -15, 0);
            scene.add(miGirasol);
            
        }, undefined, function (error) {
            console.error('Hubo un error cargando el modelo GLB:', error);
        });

        // 5. Bucle de animación (para que rote suavemente)
        function animate() {
            requestAnimationFrame(animate);
            if (miGirasol) {
                miGirasol.rotation.y += 0.01; 
            }
            renderer.render(scene, camera);
        }
        animate();

        // 6. Ajustar el tamaño si cambias la ventana o giras el celular
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
